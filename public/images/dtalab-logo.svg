<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60" role="img" aria-label="DTALab">
  <defs>
    <linearGradient id="dtaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3A6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D5FA8;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle texture pattern -->
    <pattern id="noise" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="url(#dtaGrad)"/>
      <circle cx="1" cy="1" r="0.5" fill="rgba(255,255,255,0.06)"/>
      <circle cx="3" cy="3" r="0.4" fill="rgba(0,0,0,0.08)"/>
    </pattern>
  </defs>

  <!-- DTA letters with fill -->
  <text x="4" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="900"
        fill="url(#dtaGrad)" letter-spacing="-1">DTA</text>

  <!-- Thin underline accent in Unimore orange -->
  <rect x="4" y="52" width="118" height="3" rx="1.5" fill="#E5332A"/>

  <!-- "Lab" subscript -->
  <text x="122" y="48" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"
        fill="#58585A" letter-spacing="0">Lab</text>
</svg>
